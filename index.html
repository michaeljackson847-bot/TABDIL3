<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabdeal Market Dashboard</title><style>body{margin:0;background:#080b12;color:#edf2f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px 16px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:0}.muted{color:#8995a8}input,button{background:#111827;color:#fff;border:1px solid #2a374d;border-radius:9px;padding:10px 12px}input{min-width:240px}button{cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.card{background:#0e1420;border:1px solid #202c40;border-radius:13px;padding:16px}.num{font-size:24px;font-weight:700;margin-top:7px}.table{overflow:auto;border:1px solid #202c40;border-radius:13px}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:12px;border-bottom:1px solid #1b2535;text-align:right}th{color:#8d99ad;background:#0d1420}.up{color:#43d392}.down{color:#ff6b78}.error{margin:12px 0;padding:12px;border-radius:9px;background:#28151b;color:#ffb3bd;display:none}.empty{text-align:center;padding:40px;color:#8995a8}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}input{min-width:0;width:100%}}</style></head><body><main class="wrap"><header><div><h1>داشبورد بازار تبدیل</h1><p class="muted">قیمت‌ها و بازارهای عمومی</p></div><div><input id="search" placeholder="جستجوی بازار..."><button id="refresh">بروزرسانی</button></div></header><div id="error" class="error"></div><section class="cards"><div class="card"><span class="muted">تعداد بازار</span><div id="count" class="num">—</div></div><div class="card"><span class="muted">بازار USDT</span><div id="usdt" class="num">—</div></div><div class="card"><span class="muted">بیشترین رشد</span><div id="gain" class="num">—</div></div><div class="card"><span class="muted">بیشترین افت</span><div id="loss" class="num">—</div></div></section><div class="table"><table><thead><tr><th>بازار</th><th>قیمت</th><th>تغییر ۲۴ساعت</th><th>بیشترین</th><th>کمترین</th><th>حجم</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">در حال دریافت...</td></tr></tbody></table></div></main><script>const API='https://api1.tabdeal.org';let data=[];const $=x=>document.getElementById(x);const num=x=>Number.isFinite(Number(x))?Number(x):null;const fmt=x=>x==null?'—':Number(x).toLocaleString('en-US',{maximumSignificantDigits:10});async function api(path){const r=await fetch(API+path,{headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}function render(){const q=$('search').value.trim().toUpperCase();const a=data.filter(x=>!q||x.symbol.toUpperCase().includes(q));$('count').textContent=data.length.toLocaleString('en-US');$('usdt').textContent=data.filter(x=>x.quote==='USDT').length.toLocaleString('en-US');const valid=a.filter(x=>x.change!=null);if(valid.length){const g=valid.reduce((p,x)=>x.change>p.change?x:p),l=valid.reduce((p,x)=>x.change<p.change?x:p);$('gain').textContent=g.symbol+' '+(g.change>0?'+':'')+g.change.toFixed(2)+'%';$('loss').textContent=l.symbol+' '+(l.change>0?'+':'')+l.change.toFixed(2)+'%'}$('rows').innerHTML=a.length?a.map(x=>'<tr><td><b>'+x.symbol+'</b></td><td>'+fmt(x.price)+'</td><td class="'+(x.change>0?'up':x.change<0?'down':'')+'">'+(x.change==null?'—':(x.change>0?'+':'')+x.change.toFixed(2)+'%')+'</td><td>'+fmt(x.high)+'</td><td>'+fmt(x.low)+'</td><td>'+fmt(x.volume)+'</td></tr>').join(''):'<tr><td colspan="6" class="empty">بازاری پیدا نشد</td></tr>'}async function load(){try{$('error').style.display='none';let raw=await api('/r/api/v1/exchangeInfo');let ms=Array.isArray(raw)?raw:(raw.data||raw.symbols||[]);const now=Math.floor(Date.now()/1000),from=now-86400;data=ms.filter(x=>!x.status||x.status==='TRADING').map(x=>({id:x.symbol||'',symbol:(x.baseAsset||String(x.symbol||'').split('_')[0])+'/'+(x.quoteAsset||String(x.symbol||'').split('_').slice(1).join('_')),quote:(x.quoteAsset||'').toUpperCase(),apiSymbol:x.symbol||'',price:null,change:null,high:null,low:null,volume:null}));for(let i=0;i<Math.min(data.length,60);i+=10){await Promise.all(data.slice(i,i+10).map(async x=>{try{let r=await api('/r/plots/history/?symbol='+encodeURIComponent(x.apiSymbol)+'&resolution=60&from='+from+'&to='+now);let c=Array.isArray(r?.data)?r.data:[];if(!c.length)return;let close=v=>Array.isArray(v)?num(v[4]):num(v.close),high=v=>Array.isArray(v)?num(v[2]):num(v.high),low=v=>Array.isArray(v)?num(v[3]):num(v.low),vol=v=>Array.isArray(v)?num(v[5]):num(v.volume);let first=close(c[0]),last=close(c[c.length-1]);x.price=last;x.change=first?((last-first)/first)*100:null;x.high=Math.max(...c.map(high).filter(v=>v!=null));x.low=Math.min(...c.map(low).filter(v=>v!=null));x.volume=c.reduce((s,v)=>s+(vol(v)||0),0)}catch(e){}}));render()}render()}catch(e){$('error').textContent='دریافت داده ناموفق بود: '+e.message;$('error').style.display='block';$('rows').innerHTML='<tr><td colspan="6" class="empty">API در دسترس نیست یا CORS مسدود شده است.</td></tr>'}}$('search').oninput=render;$('refresh').onclick=load;load();setInterval(load,120000);</script></body></html>
